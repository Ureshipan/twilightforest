import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'fabric-loom' version '1.17.12'
	id 'maven-publish'
	id 'java-library'
	id 'eclipse'
	id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

idea {
	module {
		downloadJavadoc = true
		downloadSources = true
	}
}

loom {
	accessWidenerPath = file("src/main/resources/twilightforest.accesswidener")

	mixin {
		defaultRefmapName = "twilightforest.refmap.json"
		add sourceSets.main, "twilightforest.refmap.json"
	}

	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated(true)
			runDir("run")
		}

		server {
			server()
			setConfigName("Fabric Server")
			ideConfigGenerated(true)
			runDir("run-server")
		}

		datagenClient {
			inherit(client)
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
			vmArg "-Dfabric-api.datagen.modid=${project.mod_id}"
			runDir "build/datagen"
		}
	}
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(21))
	}
	withSourcesJar()
}

// Disable -Werror during port — too many NeoForge warnings would block compilation
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(21)
	options.compilerArgs += ['-Xmaxerrs', '20000']
}

sourceSets {
	data {
		compileClasspath += main.compileClasspath + main.output
		java {
			srcDirs = ['src/main/java', 'src/data/java']
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
}

configurations {
	dataImplementation.extendsFrom implementation
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
	mavenLocal()
	maven {
		name = 'FabricMC'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'Shedaniel'          // Cloth Config, REI
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'TerraformersMC'     // ModMenu, EMI
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'BlameJared'         // JEI
		url = 'https://maven.blamejared.com/'
	}
	maven {
		name = 'Curseforge'
		url = 'https://www.cursemaven.com'
		content {
			includeGroup 'curse.maven'
		}
	}
	maven {
		name = 'Fuzs Mod Resources'   // Forge Config API Port
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
	}
	maven {
		name = 'JitPack'              // Primitive Multipart Entities
		url = 'https://jitpack.io'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Config UI
	modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	// NeoForge ModConfigSpec on Fabric (drop-in for twilightforest config code)
	modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

	// Multipart entity support (Hydra / Naga / UrGhast parts)
	// Local jar from the GitHub release (JitPack can't serve Loom-built artifacts); Loom remaps & bundles it.
	modImplementation include(files("libs/Primitive-Multipart-Entities-${project.multipart_entities_version}.jar"))

	// ModMenu integration (optional)
//	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Recipe viewers – uncomment one once versions for 1.21.11 are known
//	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
//	modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
//	modCompileOnly "dev.emi:emi-fabric:${project.emi_version}+${project.minecraft_version}"

	// Test framework
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		showExceptions true
		exceptionFormat 'full'
		showCauses true
		showStackTraces true
	}
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version
	inputs.property 'fabric_version', project.fabric_version
	filteringCharset 'UTF-8'

	filesMatching('fabric.mod.json') {
		expand(
			version: project.version,
			minecraft_version: project.minecraft_version,
			loader_version: project.loader_version,
			fabric_version: project.fabric_version,
		)
	}

	exclude '.cache'
	def lazyTree = providers.provider {
		fileTree(dir: getOutputs().getFiles().getAsPath(), includes: ['**/*.json', '**/*.mcmeta'])
	}
	doLast {
		lazyTree.get().each {
			File file -> file.setText(JsonOutput.toJson(new JsonSlurper().parse(file)))
		}
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	exclude 'data/twilightforest/function/**'
	manifest {
		attributes([
			'Specification-Title'     : project.mod_id,
			'Specification-Vendor'    : 'TeamTwilight',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'TeamTwilight',
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
		])
	}
}

tasks.register('sourceJar', Jar) {
	dependsOn 'classes'
	from sourceSets.main.allSource
	archiveClassifier = 'sources'
}

def mavenUser  = System.getenv('MAVEN_USER')  ?: ''
def mavenToken = System.getenv('MAVEN_PASS')  ?: ''

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
			groupId    project.maven_group
			artifactId project.archives_base_name
			version    project.version
		}
	}
	repositories {
		if (mavenUser && mavenToken) {
			maven {
				url 'https://maven.tamaized.com/releases'
				credentials {
					username mavenUser
					password mavenToken
				}
			}
		}
	}
}
